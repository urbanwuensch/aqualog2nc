name: Build and release aqualog2nc

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
            artifact: aqualog2nc-linux-x64
            binary_name: aqualog2nc
          - os: macos-latest       # Apple Silicon runner
            triplet: arm64-osx
            artifact: aqualog2nc-macos-arm64
            binary_name: aqualog2nc
          - os: macos-13           # Intel runner
            triplet: x64-osx
            artifact: aqualog2nc-macos-x64
            binary_name: aqualog2nc
          - os: windows-latest
            triplet: x64-windows-static
            artifact: aqualog2nc-windows-x64
            binary_name: aqualog2nc.exe

    runs-on: ${{ matrix.os }}

    # Enables GitHub Actions' own cache as a vcpkg binary cache: once a
    # package (e.g. the flaky libaec download) has been built successfully
    # ONE time on a given platform, every future run reuses that result
    # instead of re-downloading/rebuilding it. This is what actually solves
    # the recurring gitlab.dkrz.de rate-limit problem long-term.
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Exposes the ACTIONS_RUNTIME_TOKEN / ACTIONS_CACHE_URL environment
      # variables vcpkg's GitHub Actions cache backend needs - without this
      # step, VCPKG_BINARY_SOURCES=x-gha fails with a "requires
      # ACTIONS_RUNTIME_TOKEN" error.
      - name: Export GitHub Actions cache environment variables
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # Pin to a known vcpkg revision for reproducible builds. Update
          # this on purpose (e.g. when you want newer library versions),
          # not as a side effect of an unrelated change.
          vcpkgGitCommitId: 'f3e10653cc27d62a37a3763cd84b38bca07c6075'
          
      - name: Pre-seed vcpkg download cache with local libaec archive
        shell: bash
        run: |
          mkdir -p "${VCPKG_ROOT}/downloads"
          cp "${{ github.workspace }}/vcpkg-downloads/k202009-libaec-v1.1.6.tar.gz" "${VCPKG_ROOT}/downloads/"

      - name: Configure (retries automatically on flaky download mirrors)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 8
          retry_wait_seconds: 120
          shell: bash
          command: >
            cmake -B build -S .
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
            -DBUILD_SHARED_LIBS=OFF
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target aqualog2nc

      - name: Locate and rename binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          found=$(find build -name "${{ matrix.binary_name }}" -type f | head -n 1)
          if [ -z "$found" ]; then
            echo "Could not find built binary '${{ matrix.binary_name }}' under build/ - check the build log above."
            exit 1
          fi
          cp "$found" "${{ matrix.artifact }}"
          chmod +x "${{ matrix.artifact }}"

      - name: Locate and rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter "${{ matrix.binary_name }}" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Could not find built binary '${{ matrix.binary_name }}' under build/ - check the build log above."
            exit 1
          }
          Copy-Item $exe.FullName "${{ matrix.artifact }}.exe"

      - name: Sanity-check for stray dynamic dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "Reviewing dynamic dependencies - should be base libc/libstdc++/libm only:"
          ldd "${{ matrix.artifact }}" || true

      - name: Sanity-check for stray dynamic dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "Reviewing dynamic dependencies - should show no /opt/homebrew or /usr/local paths:"
          otool -L "${{ matrix.artifact }}" || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
